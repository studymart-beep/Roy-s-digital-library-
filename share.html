<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#faf5ea" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Shared Prompt — Roy's Digital Library</title>
  <meta name="description" content="Copy this ready-to-use AI prompt with one tap." />
  <meta property="og:title" content="Shared Prompt — Roy's Digital Library" />
  <meta property="og:description" content="Copy this ready-to-use AI prompt with one tap." />
  <meta property="og:type" content="website" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    body { background: #faf5ea; min-height: 100vh; }
    .share-page {
      max-width: 560px;
      margin: 0 auto;
      padding: 32px 20px 48px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .share-logo { width: 64px; height: 64px; border-radius: 50%; margin-bottom: 16px; object-fit: contain; background: rgba(201,162,39,0.14); padding: 8px; }
    .share-brand {
      font-size: 11px; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; color: #b8901f; margin-bottom: 28px;
    }
    .share-card {
      width: 100%;
      background: #fffdf9;
      border: 1px solid #e9dfc7;
      border-radius: 20px;
      padding: 26px 22px;
      margin-bottom: 20px;
      box-shadow: 0 10px 34px rgba(120, 96, 40, 0.14);
    }
    .share-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 21px; font-weight: 700; letter-spacing: -0.01em;
      margin-bottom: 14px; color: #1e2436;
    }
    .share-content {
      font-size: 14.5px; line-height: 1.6; color: #6b6250;
      white-space: pre-wrap; word-break: break-word;
      max-height: 50vh; overflow-y: auto;
    }
    .share-copy {
      width: 100%; height: 52px; border: none; border-radius: 26px;
      background: linear-gradient(145deg, #f5d04a, #c9a227);
      color: #2b2716; font-size: 15px; font-weight: 700;
      cursor: pointer; font-family: inherit;
      box-shadow: 0 6px 18px rgba(232, 185, 35, 0.35);
    }
    .share-copy:active { transform: scale(0.98); }
    .share-copy.done { background: #3f9142; color: #fffdf8; box-shadow: none; }
    .share-foot {
      margin-top: 28px; font-size: 12px; color: #948a72; text-align: center;
    }
    .share-error, .share-loading {
      color: #6b6250; text-align: center; padding: 48px 16px; font-size: 15px;
    }
    .share-error { color: #c0392b; }
  </style>
</head>
<body>
  <div class="share-page" id="root">
    <div class="share-loading">Loading…</div>
  </div>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    import { SUPABASE_URL, SUPABASE_ANON_KEY, CLOUD_ENABLED } from './src/config.js';

    const root = document.getElementById('root');
    const params = new URLSearchParams(location.search);
    const token = params.get('t') || params.get('token') || '';

    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.cssText = 'position:fixed;opacity:0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); return true; }
        catch { return false; }
        finally { document.body.removeChild(ta); }
      }
    }

    function renderShare(item) {
      document.title = item.title + " — Roy's Digital Library";
      const desc = document.querySelector('meta[name="description"]');
      if (desc) desc.setAttribute('content', 'Copy this ready-to-use AI prompt with one tap.');
      const ogt = document.querySelector('meta[property="og:title"]');
      if (ogt) ogt.setAttribute('content', item.title + " — Roy's Digital Library");

      root.innerHTML = `
        <img class="share-logo" src="logo.png" alt="Roy's Digital Library" />
        <div class="share-brand">Roy's Digital Library</div>
        <div class="share-card">
          <div class="share-title">${escapeHtml(item.title)}</div>
          <div class="share-content">${escapeHtml(item.content)}</div>
        </div>
        <button class="share-copy" id="btn-copy" type="button">Copy Prompt</button>
        <div class="share-foot">Shared from Roy's Digital Library</div>
      `;
      const btn = document.getElementById('btn-copy');
      btn.addEventListener('click', async () => {
        const ok = await copyText(item.content);
        if (ok) {
          btn.textContent = '✓ Copied';
          btn.classList.add('done');
          setTimeout(() => {
            btn.textContent = 'Copy Prompt';
            btn.classList.remove('done');
          }, 2000);
        } else {
          btn.textContent = 'Copy failed — select text manually';
        }
      });
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    async function main() {
      if (!token) {
        root.innerHTML = '<div class="share-error">Invalid share link.</div>';
        return;
      }
      if (!CLOUD_ENABLED) {
        root.innerHTML = '<div class="share-error">Sharing is not configured on this deployment.</div>';
        return;
      }
      try {
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const { data, error } = await supabase.rpc('get_public_share', { p_token: token });
        if (error) throw error;
        if (!data || !data.length) {
          root.innerHTML = '<div class="share-error">This share link is invalid or has been revoked.</div>';
          return;
        }
        renderShare(data[0]);
      } catch (e) {
        console.error(e);
        root.innerHTML = '<div class="share-error">Unable to load this shared prompt.</div>';
      }
    }
    main();
  </script>
</body>
</html>
